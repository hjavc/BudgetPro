<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BudgetPro – Finance Tracker</title>
  <style>
    /* ── Design tokens ── */
    :root {
      --green:        #22c55e;
      --green-light:  #dcfce7;
      --red:          #ef4444;
      --red-light:    #fee2e2;
      --blue:         #3b82f6;
      --blue-light:   #dbeafe;
      --purple:       #a855f7;
      --purple-light: #f3e8ff;
      --amber:        #f59e0b;
      --amber-light:  #fef3c7;
      --gray-50:      #f9fafb;
      --gray-100:     #f3f4f6;
      --gray-200:     #e5e7eb;
      --gray-400:     #9ca3af;
      --gray-600:     #4b5563;
      --gray-800:     #1f2937;
      --white:        #ffffff;
      --radius:       12px;
      --shadow:       0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header span { font-size: 0.75rem; color: var(--gray-400); }

    /* ── Layout ── */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .section {
      background: var(--white);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--gray-400);
      margin-bottom: 14px;
    }

    /* ── Summary cards (top 3) ── */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 16px 14px;
      box-shadow: var(--shadow);
    }
    .summary-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--gray-400);
      margin-bottom: 5px;
    }
    .summary-value {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .summary-card.income  .summary-value { color: var(--green); }
    .summary-card.expense .summary-value { color: var(--red); }
    .summary-card.balance .summary-value { color: var(--blue); }

    /* ── Compact 2-col grid (weekly cashflow + tax tracker) ── */
    .compact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .compact-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 16px 14px;
      box-shadow: var(--shadow);
    }
    .compact-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--gray-400);
      margin-bottom: 10px;
    }
    .mini-stats { display: flex; flex-direction: column; gap: 5px; }
    .mini-stat  { display: flex; justify-content: space-between; align-items: baseline; }
    .mini-stat-label { font-size: 0.72rem; color: var(--gray-600); }
    .mini-stat-value { font-size: 0.88rem; font-weight: 700; }
    .mini-stat-value.green  { color: var(--green); }
    .mini-stat-value.red    { color: var(--red); }
    .mini-stat-value.blue   { color: var(--blue); }
    .mini-stat-value.amber  { color: var(--amber); }
    .mini-divider { border: none; border-top: 1px solid var(--gray-100); margin: 4px 0; }
    .mini-note { font-size: 0.67rem; color: var(--gray-400); margin-top: 6px; line-height: 1.4; }

    /* Tax % inline setting */
    .tax-setting {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 9px;
    }
    .tax-setting label {
      display: inline;
      font-size: 0.67rem;
      font-weight: 600;
      color: var(--gray-400);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap;
    }
    .tax-setting input {
      width: 48px;
      padding: 3px 6px;
      font-size: 0.78rem;
      font-weight: 700;
      text-align: center;
      border: 1.5px solid var(--gray-200);
      border-radius: 6px;
      background: var(--gray-50);
      outline: none;
    }
    .tax-setting input:focus { border-color: var(--blue); background: var(--white); }
    .tax-setting span { font-size: 0.78rem; color: var(--gray-600); }

    /* ── Tag pills ── */
    .tag-pill {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      vertical-align: middle;
      margin-left: 4px;
    }
    .tag-pill.business { background: var(--blue-light);   color: #1d4ed8; }
    .tag-pill.personal { background: var(--green-light);  color: #15803d; }
    .tag-pill.family   { background: var(--purple-light); color: #7e22ce; }
    .tag-pill.tax      { background: var(--amber-light);  color: #b45309; }

    /* ── Type toggle ── */
    .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
    .type-btn {
      flex: 1;
      padding: 8px;
      border: 2px solid var(--gray-200);
      border-radius: 8px;
      background: var(--white);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      color: var(--gray-600);
    }
    .type-btn.income.active  { background: var(--green-light); border-color: var(--green); color: #15803d; }
    .type-btn.expense.active { background: var(--red-light);   border-color: var(--red);   color: #b91c1c; }

    /* ── Form ── */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 0.73rem;
      font-weight: 600;
      color: var(--gray-600);
      margin-bottom: 4px;
    }
    input, select, textarea {
      width: 100%;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.875rem;
      color: var(--gray-800);
      background: var(--gray-50);
      transition: border-color .15s, background .15s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      background: var(--white);
    }

    /* ── Buttons ── */
    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn:hover  { opacity: .88; }
    .btn-primary { background: var(--blue);     color: white; }
    .btn-danger  { background: var(--red);      color: white; }
    .btn-gray    { background: var(--gray-200); color: var(--gray-800); }
    .btn-sm      { padding: 5px 10px; font-size: 0.73rem; border-radius: 6px; }
    .btn-full    { width: 100%; margin-top: 8px; }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 8px;
    }
    .filters select { flex: 1; min-width: 140px; max-width: 210px; }

    .filter-pills {
      display: flex;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      overflow: hidden;
      background: var(--white);
      flex-wrap: nowrap;
    }
    .filter-pills button {
      padding: 6px 10px;
      border: none;
      background: none;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--gray-600);
      transition: all .15s;
      white-space: nowrap;
    }
    .filter-pills button.active { background: var(--blue); color: white; }

    /* ── Chart ── */
    canvas { display: block; width: 100%; border-radius: 6px; }
    .chart-legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 10px;
      font-size: 0.73rem;
      color: var(--gray-600);
    }
    .legend-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* ── Transaction list ── */
    .tx-list { display: flex; flex-direction: column; gap: 8px; }

    .tx-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      background: var(--white);
      border-radius: 10px;
      box-shadow: var(--shadow);
      transition: box-shadow .15s;
    }
    .tx-item:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); }

    .tx-icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .tx-icon.income  { background: var(--green-light); }
    .tx-icon.expense { background: var(--red-light); }

    .tx-info { flex: 1; min-width: 0; }
    .tx-cat  { font-size: 0.85rem; font-weight: 600; color: var(--gray-800); }
    .tx-meta {
      font-size: 0.71rem; color: var(--gray-400);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .tx-amount {
      font-size: 0.95rem; font-weight: 700;
      flex-shrink: 0; text-align: right;
    }
    .tx-amount.income  { color: var(--green); }
    .tx-amount.expense { color: var(--red); }
    .tx-actions { display: flex; gap: 4px; flex-shrink: 0; }

    .empty-state {
      text-align: center; color: var(--gray-400);
      padding: 32px 16px; font-size: 0.875rem;
    }

    /* ── Recurring bills ── */
    .rec-list { display: flex; flex-direction: column; gap: 8px; }

    .rec-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 10px;
    }
    .rec-item.due-soon {
      border-color: var(--amber);
      background: var(--amber-light);
    }
    .rec-info { flex: 1; min-width: 0; }
    .rec-name { font-size: 0.85rem; font-weight: 600; }
    .rec-meta { font-size: 0.71rem; color: var(--gray-400); }
    .rec-amount { font-size: 0.9rem; font-weight: 700; color: var(--red); flex-shrink: 0; }
    .rec-actions { display: flex; gap: 4px; flex-shrink: 0; }

    .due-soon-badge {
      font-size: 0.62rem;
      font-weight: 700;
      background: var(--amber);
      color: white;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-left: 5px;
    }

    .rec-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      margin-top: 4px;
      border-top: 1px solid var(--gray-100);
    }
    .rec-footer-label { font-size: 0.82rem; color: var(--gray-600); }
    .rec-footer-value { font-size: 1.05rem; font-weight: 800; color: var(--red); }

    /* ── Footer actions ── */
    .footer-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--gray-200);
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 200;
      align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%; max-width: 440px;
      box-shadow: 0 24px 64px rgba(0,0,0,.22);
      animation: pop .15s ease-out;
    }
    @keyframes pop {
      from { transform: scale(.95); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .summary { grid-template-columns: 1fr 1fr; }
      .summary-card.balance { grid-column: span 2; }
      .compact-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .summary-value { font-size: 1.1rem; }
    }
    @media (max-width: 340px) {
      .summary { grid-template-columns: 1fr; }
      .summary-card.balance { grid-column: span 1; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════ HEADER ═══════════════════ -->
<header>
  <h1>💰 BudgetPro</h1>
  <span id="header-date"></span>
</header>

<div class="container">

  <!-- ═══════════════════ SUMMARY CARDS ═══════════════════ -->
  <div class="summary">
    <div class="summary-card income">
      <div class="summary-label">Income</div>
      <div class="summary-value" id="total-income">$0</div>
    </div>
    <div class="summary-card expense">
      <div class="summary-label">Expenses</div>
      <div class="summary-value" id="total-expense">$0</div>
    </div>
    <div class="summary-card balance">
      <div class="summary-label">Balance</div>
      <div class="summary-value" id="net-balance">$0</div>
    </div>
  </div>

  <!-- ═══════════════════ WEEKLY CASHFLOW + TAX TRACKER ═══════════════════ -->
  <div class="compact-grid">

    <!-- Weekly Cashflow -->
    <div class="compact-card">
      <div class="compact-title">📅 This Week</div>
      <div class="mini-stats">
        <div class="mini-stat">
          <span class="mini-stat-label">Income</span>
          <span class="mini-stat-value green" id="week-income">$0</span>
        </div>
        <div class="mini-stat">
          <span class="mini-stat-label">Expenses</span>
          <span class="mini-stat-value red" id="week-expense">$0</span>
        </div>
        <hr class="mini-divider">
        <div class="mini-stat">
          <span class="mini-stat-label">Net</span>
          <span class="mini-stat-value blue" id="week-net">$0</span>
        </div>
      </div>
      <div class="mini-note" id="week-lastnet"></div>
    </div>

    <!-- Tax Set-Aside Tracker -->
    <div class="compact-card">
      <div class="compact-title">🧾 Tax Set-Aside</div>
      <div class="tax-setting">
        <label for="tax-pct">Rate</label>
        <input type="number" id="tax-pct" value="25" min="1" max="99" step="1" oninput="saveTaxPct()" />
        <span>%</span>
      </div>
      <div class="mini-stats">
        <div class="mini-stat">
          <span class="mini-stat-label">Target</span>
          <span class="mini-stat-value amber" id="tax-target">$0</span>
        </div>
        <div class="mini-stat">
          <span class="mini-stat-label">Saved</span>
          <span class="mini-stat-value green" id="tax-saved">$0</span>
        </div>
        <hr class="mini-divider">
        <div class="mini-stat">
          <span class="mini-stat-label">Gap</span>
          <span class="mini-stat-value red" id="tax-gap">$0</span>
        </div>
      </div>
    </div>

  </div>

  <!-- ═══════════════════ ADD TRANSACTION ═══════════════════ -->
  <div class="section">
    <div class="section-title">Add Transaction</div>

    <div class="type-toggle">
      <button class="type-btn income active" id="btn-income"  onclick="setType('income')">＋ Income</button>
      <button class="type-btn expense"       id="btn-expense" onclick="setType('expense')">－ Expense</button>
    </div>

    <div class="form-row">
      <div>
        <label for="form-amount">Amount ($)</label>
        <input type="number" id="form-amount" placeholder="0.00" min="0" step="0.01" />
      </div>
      <div>
        <label for="form-date">Date</label>
        <input type="date" id="form-date" />
      </div>
    </div>

    <div class="form-row">
      <div>
        <label for="form-category">Category</label>
        <select id="form-category"></select>
      </div>
      <div>
        <label for="form-tag">Account Tag</label>
        <select id="form-tag">
          <option value="personal">Personal</option>
          <option value="business">Business</option>
          <option value="family">Family</option>
          <option value="tax">Tax</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom:8px">
      <label for="form-note">Note (optional)</label>
      <input type="text" id="form-note" placeholder="e.g. 3-car detail job" maxlength="80" />
    </div>

    <button class="btn btn-primary btn-full" onclick="submitForm()">Add Transaction</button>
  </div>

  <!-- ═══════════════════ CHART ═══════════════════ -->
  <div class="section">
    <div class="section-title">Monthly Overview — Last 6 Months</div>
    <canvas id="chart" height="180"></canvas>
    <div class="chart-legend">
      <span><span class="legend-dot" style="background:var(--green)"></span>Income</span>
      <span><span class="legend-dot" style="background:var(--red)"></span>Expenses</span>
    </div>
  </div>

  <!-- ═══════════════════ TRANSACTIONS ═══════════════════ -->
  <div class="section">
    <div class="section-title">Transactions</div>

    <!-- Row 1: Month filter + type filter -->
    <div class="filters">
      <select id="filter-month" onchange="render()"></select>
      <div class="filter-pills" id="filter-type-btns">
        <button class="active" onclick="setFilterType('all',this)">All</button>
        <button onclick="setFilterType('income',this)">Income</button>
        <button onclick="setFilterType('expense',this)">Expense</button>
      </div>
    </div>

    <!-- Row 2: Tag filter -->
    <div class="filters" style="margin-bottom:14px">
      <div class="filter-pills" id="filter-tag-btns">
        <button class="active" onclick="setFilterTag('all',this)">All Tags</button>
        <button onclick="setFilterTag('personal',this)">Personal</button>
        <button onclick="setFilterTag('business',this)">Business</button>
        <button onclick="setFilterTag('family',this)">Family</button>
        <button onclick="setFilterTag('tax',this)">Tax</button>
      </div>
    </div>

    <div class="tx-list" id="tx-list"></div>
  </div>

  <!-- ═══════════════════ RECURRING BILLS ═══════════════════ -->
  <div class="section">
    <div class="section-title">Recurring Bills</div>
    <div class="rec-list" id="rec-list"></div>
    <button class="btn btn-gray btn-sm" style="margin-top:12px" onclick="openAddRecurring()">＋ Add Recurring Bill</button>
    <div class="rec-footer">
      <span class="rec-footer-label">Monthly Fixed Costs</span>
      <span class="rec-footer-value" id="rec-total">$0.00</span>
    </div>
  </div>

  <!-- ═══════════════════ FOOTER ACTIONS ═══════════════════ -->
  <div class="footer-actions">
    <button class="btn btn-gray btn-sm" onclick="exportJSON()">⬇ Export JSON</button>
    <label  class="btn btn-gray btn-sm" style="cursor:pointer">
      ⬆ Import JSON
      <input type="file" accept=".json" onchange="importData(event)" style="display:none" />
    </label>
    <button class="btn btn-gray btn-sm" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="btn btn-danger btn-sm" onclick="clearAll()">🗑 Clear All Data</button>
  </div>

</div><!-- /container -->

<!-- ═══════════════════ EDIT TRANSACTION MODAL ═══════════════════ -->
<div class="modal-overlay" id="edit-modal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-title">Edit Transaction</div>

    <div class="type-toggle">
      <button class="type-btn income"  id="edit-btn-income"  onclick="setEditType('income')">＋ Income</button>
      <button class="type-btn expense" id="edit-btn-expense" onclick="setEditType('expense')">－ Expense</button>
    </div>

    <div class="form-row">
      <div>
        <label for="edit-amount">Amount ($)</label>
        <input type="number" id="edit-amount" placeholder="0.00" min="0" step="0.01" />
      </div>
      <div>
        <label for="edit-date">Date</label>
        <input type="date" id="edit-date" />
      </div>
    </div>

    <div class="form-row">
      <div>
        <label for="edit-category">Category</label>
        <select id="edit-category"></select>
      </div>
      <div>
        <label for="edit-tag">Account Tag</label>
        <select id="edit-tag">
          <option value="personal">Personal</option>
          <option value="business">Business</option>
          <option value="family">Family</option>
          <option value="tax">Tax</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom:10px">
      <label for="edit-note">Note</label>
      <input type="text" id="edit-note" placeholder="optional" maxlength="80" />
    </div>

    <div class="modal-actions">
      <button class="btn btn-gray"    onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- ═══════════════════ RECURRING BILL MODAL ═══════════════════ -->
<div class="modal-overlay" id="rec-modal" onclick="handleRecOverlayClick(event)">
  <div class="modal">
    <div class="modal-title" id="rec-modal-title">Add Recurring Bill</div>

    <div class="form-row">
      <div>
        <label for="rec-name">Bill Name</label>
        <input type="text" id="rec-name" placeholder="e.g. Netflix" maxlength="60" />
      </div>
      <div>
        <label for="rec-amount">Amount ($)</label>
        <input type="number" id="rec-amount" placeholder="0.00" min="0" step="0.01" />
      </div>
    </div>

    <div class="form-row">
      <div>
        <label for="rec-due-day">Due Day (1–31)</label>
        <input type="number" id="rec-due-day" placeholder="1" min="1" max="31" step="1" />
      </div>
      <div>
        <label for="rec-category">Category</label>
        <select id="rec-category">
          <option>Rent</option>
          <option>Utilities</option>
          <option>Vehicle</option>
          <option>Supplies</option>
          <option>Tools</option>
          <option>Food</option>
          <option>Gas</option>
          <option>Kids</option>
          <option>Misc</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom:10px">
      <label for="rec-note">Note (optional)</label>
      <input type="text" id="rec-note" placeholder="optional" maxlength="80" />
    </div>

    <div class="modal-actions">
      <button class="btn btn-gray"    onclick="closeRecModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveRecurringBill()">Save Bill</button>
    </div>
  </div>
</div>

<!-- ═══════════════════ SCRIPT ═══════════════════ -->
<script>
  // ─────────────────────────────────────────────────────────
  // CONSTANTS
  // ─────────────────────────────────────────────────────────

  const CATEGORIES = {
    income:  ['Pressure Washing', 'Detailing', 'DoorDash', 'Other'],
    expense: ['Gas', 'Food', 'Supplies', 'Tools', 'Rent', 'Utilities', 'Vehicle', 'Kids', 'Misc']
  };

  const ICONS = {
    'Pressure Washing': '🚿', 'Detailing': '🚗', 'DoorDash': '🛵', 'Other': '💼',
    'Gas': '⛽', 'Food': '🍔', 'Supplies': '📦', 'Tools': '🔧',
    'Rent': '🏠', 'Utilities': '💡', 'Vehicle': '🚙', 'Kids': '👶', 'Misc': '📌'
  };

  const LS_KEY       = 'budgetpro_v1';
  const LS_SETTINGS  = 'budgetpro_settings';
  const LS_RECURRING = 'budgetpro_recurring';

  // ─────────────────────────────────────────────────────────
  // STATE
  // ─────────────────────────────────────────────────────────

  let transactions = [];
  let recurring    = [];
  let currentType  = 'income';
  let editType     = 'income';
  let editId       = null;
  let recEditId    = null;
  let filterType   = 'all';
  let filterTag    = 'all';
  let taxPct       = 25;

  // ─────────────────────────────────────────────────────────
  // STORAGE
  // ─────────────────────────────────────────────────────────

  function saveData() {
    localStorage.setItem(LS_KEY, JSON.stringify(transactions));
  }

  function loadData() {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      try {
        transactions = JSON.parse(raw);
        // Migration: add tag:'personal' to any transaction missing it
        transactions = transactions.map(t => ({ tag: 'personal', ...t }));
      } catch { transactions = []; }
    } else {
      seedData();
    }
  }

  function saveSettings() {
    localStorage.setItem(LS_SETTINGS, JSON.stringify({ taxPct }));
  }

  function loadSettings() {
    const raw = localStorage.getItem(LS_SETTINGS);
    if (raw) {
      try {
        const s = JSON.parse(raw);
        if (typeof s.taxPct === 'number') taxPct = s.taxPct;
      } catch {}
    }
    document.getElementById('tax-pct').value = taxPct;
  }

  function saveTaxPct() {
    const v = parseFloat(document.getElementById('tax-pct').value);
    if (v > 0 && v <= 99) taxPct = v;
    saveSettings();
    renderTaxTracker();
  }

  function saveRecurringData() {
    localStorage.setItem(LS_RECURRING, JSON.stringify(recurring));
  }

  function loadRecurringData() {
    const raw = localStorage.getItem(LS_RECURRING);
    if (raw) {
      try { recurring = JSON.parse(raw); } catch { recurring = []; }
    }
  }

  // ─────────────────────────────────────────────────────────
  // SEED DATA  (only on very first load — no existing localStorage)
  // ─────────────────────────────────────────────────────────

  function seedData() {
    const today = new Date();
    function ago(days) {
      const d = new Date(today);
      d.setDate(d.getDate() - days);
      return d.toISOString().split('T')[0];
    }

    transactions = [
      { id: uid(), type: 'income',  amount: 320,   category: 'Pressure Washing', tag: 'business', date: ago(2),  note: '4-house job in the neighborhood' },
      { id: uid(), type: 'income',  amount: 150,   category: 'Detailing',        tag: 'business', date: ago(5),  note: 'Full detail on SUV' },
      { id: uid(), type: 'income',  amount: 87.50, category: 'DoorDash',         tag: 'personal', date: ago(7),  note: 'Friday evening shift' },
      { id: uid(), type: 'income',  amount: 90,    category: 'Other',            tag: 'tax',      date: ago(8),  note: 'Tax set-aside — 25% of income' },
      { id: uid(), type: 'expense', amount: 65,    category: 'Gas',              tag: 'business', date: ago(3),  note: 'Fill up truck' },
      { id: uid(), type: 'expense', amount: 42,    category: 'Supplies',         tag: 'business', date: ago(6),  note: 'Soap, microfiber towels' },
      { id: uid(), type: 'expense', amount: 850,   category: 'Rent',             tag: 'personal', date: ago(10), note: 'Monthly rent' },
      { id: uid(), type: 'income',  amount: 200,   category: 'Pressure Washing', tag: 'business', date: ago(15), note: 'Driveway + back patio' },
      { id: uid(), type: 'expense', amount: 38,    category: 'Food',             tag: 'family',   date: ago(4),  note: 'Grocery run' },
      { id: uid(), type: 'expense', amount: 120,   category: 'Vehicle',          tag: 'business', date: ago(20), note: 'Oil change + new wipers' },
      { id: uid(), type: 'income',  amount: 260,   category: 'Detailing',        tag: 'business', date: ago(22), note: '2-car detail package' },
      { id: uid(), type: 'income',  amount: 95,    category: 'DoorDash',         tag: 'personal', date: ago(35), note: 'Weekend shift' },
      { id: uid(), type: 'expense', amount: 55,    category: 'Tools',            tag: 'business', date: ago(38), note: 'New foam cannon' },
    ];

    saveData();
  }

  // ─────────────────────────────────────────────────────────
  // UTILITIES
  // ─────────────────────────────────────────────────────────

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function fmt$(n) {
    return '$' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function fmtDate(str) {
    const [y, m, d] = str.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[+m - 1]} ${+d}, ${y}`;
  }

  // Returns { start, end } as 'YYYY-MM-DD' strings for a Mon–Sun week.
  // offsetWeeks: 0 = current week, -1 = last week, etc.
  function getWeekRange(offsetWeeks) {
    const now = new Date();
    const day = now.getDay(); // 0=Sun, 1=Mon ... 6=Sat
    const diffToMon = (day === 0) ? -6 : 1 - day;
    const mon = new Date(now);
    mon.setDate(now.getDate() + diffToMon + offsetWeeks * 7);
    mon.setHours(0, 0, 0, 0);
    const sun = new Date(mon);
    sun.setDate(mon.getDate() + 6);
    function ymd(d) { return d.toISOString().split('T')[0]; }
    return { start: ymd(mon), end: ymd(sun) };
  }

  // Simple HTML escape to prevent XSS in user-supplied strings
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Day-of-month ordinal suffix: 1→"st", 2→"nd", 3→"rd", others→"th"
  function ordinal(n) {
    if (n === 1) return 'st';
    if (n === 2) return 'nd';
    if (n === 3) return 'rd';
    return 'th';
  }

  // ─────────────────────────────────────────────────────────
  // FORM — TYPE TOGGLE & CATEGORY POPULATION
  // ─────────────────────────────────────────────────────────

  function setType(type) {
    currentType = type;
    document.getElementById('btn-income').classList.toggle('active',  type === 'income');
    document.getElementById('btn-expense').classList.toggle('active', type === 'expense');
    populateCategories('form-category', type);
  }

  function setEditType(type) {
    editType = type;
    document.getElementById('edit-btn-income').classList.toggle('active',  type === 'income');
    document.getElementById('edit-btn-expense').classList.toggle('active', type === 'expense');
    populateCategories('edit-category', type);
  }

  function populateCategories(selectId, type) {
    const sel = document.getElementById(selectId);
    sel.innerHTML = CATEGORIES[type]
      .map(c => `<option value="${c}">${c}</option>`)
      .join('');
  }

  // ─────────────────────────────────────────────────────────
  // CRUD — TRANSACTIONS
  // ─────────────────────────────────────────────────────────

  function submitForm() {
    const amount = parseFloat(document.getElementById('form-amount').value);
    const date   = document.getElementById('form-date').value;
    const cat    = document.getElementById('form-category').value;
    const tag    = document.getElementById('form-tag').value;
    const note   = document.getElementById('form-note').value.trim();

    if (!amount || amount <= 0) { alert('Please enter a valid amount.'); return; }
    if (!date)                  { alert('Please select a date.');        return; }

    transactions.push({ id: uid(), type: currentType, amount, category: cat, tag, date, note });
    saveData();

    // Keep date + type for fast repeated entry; clear amount + note
    document.getElementById('form-amount').value = '';
    document.getElementById('form-note').value   = '';

    render();
  }

  function deleteTransaction(id) {
    if (!confirm('Delete this transaction?')) return;
    transactions = transactions.filter(t => t.id !== id);
    saveData();
    render();
  }

  function openEdit(id) {
    const t = transactions.find(t => t.id === id);
    if (!t) return;

    editId = id;
    setEditType(t.type);
    document.getElementById('edit-category').value = t.category;
    document.getElementById('edit-tag').value      = t.tag || 'personal';
    document.getElementById('edit-amount').value   = t.amount;
    document.getElementById('edit-date').value     = t.date;
    document.getElementById('edit-note').value     = t.note || '';

    document.getElementById('edit-modal').classList.add('open');
  }

  function saveEdit() {
    const amount = parseFloat(document.getElementById('edit-amount').value);
    const date   = document.getElementById('edit-date').value;
    const cat    = document.getElementById('edit-category').value;
    const tag    = document.getElementById('edit-tag').value;
    const note   = document.getElementById('edit-note').value.trim();

    if (!amount || amount <= 0) { alert('Please enter a valid amount.'); return; }
    if (!date)                  { alert('Please select a date.');        return; }

    const idx = transactions.findIndex(t => t.id === editId);
    if (idx === -1) return;

    transactions[idx] = { id: editId, type: editType, amount, category: cat, tag, date, note };
    saveData();
    closeModal();
    render();
  }

  function closeModal() {
    document.getElementById('edit-modal').classList.remove('open');
    editId = null;
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('edit-modal')) closeModal();
  }

  // ─────────────────────────────────────────────────────────
  // CRUD — RECURRING BILLS
  // ─────────────────────────────────────────────────────────

  function openAddRecurring() {
    recEditId = null;
    document.getElementById('rec-modal-title').textContent = 'Add Recurring Bill';
    document.getElementById('rec-name').value    = '';
    document.getElementById('rec-amount').value  = '';
    document.getElementById('rec-due-day').value = '';
    document.getElementById('rec-note').value    = '';
    document.getElementById('rec-modal').classList.add('open');
  }

  function openEditRecurring(id) {
    const r = recurring.find(r => r.id === id);
    if (!r) return;

    recEditId = id;
    document.getElementById('rec-modal-title').textContent  = 'Edit Recurring Bill';
    document.getElementById('rec-name').value     = r.name;
    document.getElementById('rec-amount').value   = r.amount;
    document.getElementById('rec-due-day').value  = r.dueDay;
    document.getElementById('rec-category').value = r.category;
    document.getElementById('rec-note').value     = r.note || '';
    document.getElementById('rec-modal').classList.add('open');
  }

  function saveRecurringBill() {
    const name   = document.getElementById('rec-name').value.trim();
    const amount = parseFloat(document.getElementById('rec-amount').value);
    const dueDay = parseInt(document.getElementById('rec-due-day').value, 10);
    const cat    = document.getElementById('rec-category').value;
    const note   = document.getElementById('rec-note').value.trim();

    if (!name)                              { alert('Please enter a bill name.');    return; }
    if (!amount || amount <= 0)             { alert('Please enter a valid amount.'); return; }
    if (!dueDay || dueDay < 1 || dueDay > 31) { alert('Due day must be 1–31.');     return; }

    if (recEditId) {
      const idx = recurring.findIndex(r => r.id === recEditId);
      if (idx !== -1) recurring[idx] = { id: recEditId, name, amount, dueDay, category: cat, note };
    } else {
      recurring.push({ id: uid(), name, amount, dueDay, category: cat, note });
    }

    saveRecurringData();
    closeRecModal();
    renderRecurring();
  }

  function deleteRecurring(id) {
    if (!confirm('Delete this recurring bill?')) return;
    recurring = recurring.filter(r => r.id !== id);
    saveRecurringData();
    renderRecurring();
  }

  function closeRecModal() {
    document.getElementById('rec-modal').classList.remove('open');
    recEditId = null;
  }

  function handleRecOverlayClick(e) {
    if (e.target === document.getElementById('rec-modal')) closeRecModal();
  }

  // ─────────────────────────────────────────────────────────
  // FILTERS
  // ─────────────────────────────────────────────────────────

  function setFilterType(type, btn) {
    filterType = type;
    document.querySelectorAll('#filter-type-btns button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function setFilterTag(tag, btn) {
    filterTag = tag;
    document.querySelectorAll('#filter-tag-btns button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  // Build the month dropdown from existing transactions + last 6 months
  function populateMonthFilter() {
    const sel      = document.getElementById('filter-month');
    const savedVal = sel.value;

    const months = new Set(transactions.map(t => t.date.slice(0, 7)));
    const now = new Date();
    for (let i = 0; i < 6; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
    }

    const sorted = [...months].sort((a, b) => b.localeCompare(a));
    sel.innerHTML = `<option value="all">All Months</option>` +
      sorted.map(m => {
        const [y, mo] = m.split('-');
        const label = new Date(y, mo - 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        return `<option value="${m}">${label}</option>`;
      }).join('');

    if (savedVal && sel.querySelector(`option[value="${savedVal}"]`)) {
      sel.value = savedVal;
    }
  }

  // Transactions matching ALL active filters, sorted newest-first
  function getFiltered() {
    const month = document.getElementById('filter-month').value;
    return transactions
      .filter(t => {
        const okMonth = (month === 'all') || t.date.startsWith(month);
        const okType  = (filterType === 'all') || (t.type === filterType);
        const okTag   = (filterTag  === 'all') || (t.tag  === filterTag);
        return okMonth && okType && okTag;
      })
      .sort((a, b) => b.date.localeCompare(a.date));
  }

  // ─────────────────────────────────────────────────────────
  // RENDER — SUMMARY CARDS
  // ─────────────────────────────────────────────────────────

  function renderSummary() {
    const filtered = getFiltered();
    const income  = filtered.filter(t => t.type === 'income') .reduce((s, t) => s + t.amount, 0);
    const expense = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const balance = income - expense;

    document.getElementById('total-income').textContent  = fmt$(income);
    document.getElementById('total-expense').textContent = fmt$(expense);

    const balEl = document.getElementById('net-balance');
    balEl.textContent = (balance < 0 ? '-' : '') + fmt$(Math.abs(balance));
    balEl.style.color = balance >= 0 ? 'var(--green)' : 'var(--red)';
  }

  // ─────────────────────────────────────────────────────────
  // RENDER — WEEKLY CASHFLOW
  // ─────────────────────────────────────────────────────────

  function renderWeeklyCashflow() {
    function weekTotals(range) {
      const inWeek  = transactions.filter(t => t.date >= range.start && t.date <= range.end);
      const income  = inWeek.filter(t => t.type === 'income') .reduce((s, t) => s + t.amount, 0);
      const expense = inWeek.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      return { income, expense, net: income - expense };
    }

    const tw = weekTotals(getWeekRange(0));
    const lw = weekTotals(getWeekRange(-1));

    document.getElementById('week-income').textContent  = fmt$(tw.income);
    document.getElementById('week-expense').textContent = fmt$(tw.expense);

    const netEl = document.getElementById('week-net');
    netEl.textContent = (tw.net < 0 ? '-' : '') + fmt$(Math.abs(tw.net));
    netEl.className   = 'mini-stat-value ' + (tw.net >= 0 ? 'green' : 'red');

    // Last-week comparison line
    const diff  = tw.net - lw.net;
    const arrow = diff >= 0 ? '▲' : '▼';
    const color = diff >= 0 ? 'var(--green)' : 'var(--red)';
    document.getElementById('week-lastnet').innerHTML =
      `Last week net: ${fmt$(lw.net)} ` +
      `<span style="color:${color};font-weight:700">${arrow} ${fmt$(Math.abs(diff))}</span>`;
  }

  // ─────────────────────────────────────────────────────────
  // RENDER — TAX SET-ASIDE TRACKER
  // ─────────────────────────────────────────────────────────

  // Responds to the month filter only (tag/type filters are not applied).
  // Tax target = total income for period × tax rate.
  // Tax saved  = total amount of transactions tagged "tax" for period.
  function renderTaxTracker() {
    const month    = document.getElementById('filter-month').value;
    const inPeriod = transactions.filter(t => (month === 'all') || t.date.startsWith(month));

    const totalIncome = inPeriod
      .filter(t => t.type === 'income')
      .reduce((s, t) => s + t.amount, 0);

    const taxSaved = inPeriod
      .filter(t => t.tag === 'tax')
      .reduce((s, t) => s + t.amount, 0);

    const taxTarget = totalIncome * (taxPct / 100);
    const taxGap    = Math.max(0, taxTarget - taxSaved);

    document.getElementById('tax-target').textContent = fmt$(taxTarget);
    document.getElementById('tax-saved').textContent  = fmt$(taxSaved);
    document.getElementById('tax-gap').textContent    = fmt$(taxGap);
  }

  // ─────────────────────────────────────────────────────────
  // RENDER — RECURRING BILLS
  // ─────────────────────────────────────────────────────────

  function renderRecurring() {
    const list    = document.getElementById('rec-list');
    const today   = new Date();
    const todayNo = today.getDate();

    if (recurring.length === 0) {
      list.innerHTML = `<div class="empty-state" style="padding:16px 0 8px">No recurring bills yet.</div>`;
      document.getElementById('rec-total').textContent = fmt$(0);
      return;
    }

    // A bill is "due soon" if its due day falls within the next 7 days (inclusive of today)
    function isDueSoon(dueDay) {
      for (let i = 0; i <= 7; i++) {
        const d = new Date(today);
        d.setDate(todayNo + i);
        if (d.getDate() === dueDay) return true;
      }
      return false;
    }

    const sorted = [...recurring].sort((a, b) => a.dueDay - b.dueDay);

    list.innerHTML = sorted.map(r => {
      const soon = isDueSoon(r.dueDay);
      return `
        <div class="rec-item${soon ? ' due-soon' : ''}">
          <div class="rec-info">
            <div class="rec-name">
              ${escHtml(r.name)}
              ${soon ? '<span class="due-soon-badge">Due Soon</span>' : ''}
            </div>
            <div class="rec-meta">
              Due ${r.dueDay}${ordinal(r.dueDay)} · ${escHtml(r.category)}${r.note ? ' · ' + escHtml(r.note) : ''}
            </div>
          </div>
          <div class="rec-amount">−${fmt$(r.amount)}</div>
          <div class="rec-actions">
            <button class="btn btn-gray btn-sm"   title="Edit"   onclick="openEditRecurring('${r.id}')">✏️</button>
            <button class="btn btn-danger btn-sm" title="Delete" onclick="deleteRecurring('${r.id}')">🗑</button>
          </div>
        </div>
      `;
    }).join('');

    const total = recurring.reduce((s, r) => s + r.amount, 0);
    document.getElementById('rec-total').textContent = fmt$(total);
  }

  // ─────────────────────────────────────────────────────────
  // RENDER — TRANSACTION LIST
  // ─────────────────────────────────────────────────────────

  function renderTransactions() {
    const list     = document.getElementById('tx-list');
    const filtered = getFiltered();

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state">No transactions found. Add one above!</div>`;
      return;
    }

    list.innerHTML = filtered.map(t => {
      const tag = t.tag || 'personal';
      return `
        <div class="tx-item">
          <div class="tx-icon ${t.type}">${ICONS[t.category] || '💰'}</div>
          <div class="tx-info">
            <div class="tx-cat">
              ${escHtml(t.category)}
              <span class="tag-pill ${tag}">${tag}</span>
            </div>
            <div class="tx-meta">${fmtDate(t.date)}${t.note ? ' · ' + escHtml(t.note) : ''}</div>
          </div>
          <div class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '−'}${fmt$(t.amount)}</div>
          <div class="tx-actions">
            <button class="btn btn-gray btn-sm"   title="Edit"   onclick="openEdit('${t.id}')">✏️</button>
            <button class="btn btn-danger btn-sm" title="Delete" onclick="deleteTransaction('${t.id}')">🗑</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // ─────────────────────────────────────────────────────────
  // RENDER — CANVAS BAR CHART  (last 6 months, all transactions)
  // ─────────────────────────────────────────────────────────

  function renderChart() {
    const canvas = document.getElementById('chart');
    const ctx    = canvas.getContext('2d');

    const dpr  = window.devicePixelRatio || 1;
    const cssW = canvas.parentElement.clientWidth || 600;
    const cssH = 180;

    canvas.width        = cssW * dpr;
    canvas.height       = cssH * dpr;
    canvas.style.width  = cssW + 'px';
    canvas.style.height = cssH + 'px';
    ctx.scale(dpr, dpr);

    const W = cssW, H = cssH;
    ctx.clearRect(0, 0, W, H);

    // Build monthly buckets for the last 6 months
    const buckets = [];
    const now = new Date();
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      buckets.push({
        key:     `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`,
        label:   d.toLocaleDateString('en-US', { month: 'short' }),
        income:  0,
        expense: 0
      });
    }

    transactions.forEach(t => {
      const b = buckets.find(b => t.date.startsWith(b.key));
      if (!b) return;
      if (t.type === 'income')  b.income  += t.amount;
      if (t.type === 'expense') b.expense += t.amount;
    });

    const maxVal = Math.max(...buckets.flatMap(b => [b.income, b.expense]), 1);

    const padL = 54, padR = 12, padT = 14, padB = 28;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;
    const groupW = chartW / buckets.length;
    const barW   = Math.min(groupW * 0.34, 22);

    // Horizontal grid lines + Y-axis labels
    const gridCount = 4;
    ctx.font      = '10px system-ui, sans-serif';
    ctx.textAlign = 'right';

    for (let i = 0; i <= gridCount; i++) {
      const val = maxVal * (i / gridCount);
      const y   = padT + chartH - (chartH * i / gridCount);

      ctx.strokeStyle = '#e5e7eb';
      ctx.lineWidth   = 1;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(W - padR, y);
      ctx.stroke();

      ctx.fillStyle = '#9ca3af';
      ctx.fillText(
        val >= 1000 ? '$' + (val / 1000).toFixed(1) + 'k' : '$' + Math.round(val),
        padL - 4, y + 3.5
      );
    }

    // Bars + month labels
    buckets.forEach((b, idx) => {
      const cx = padL + idx * groupW + groupW / 2;

      if (b.income > 0) {
        const h = (b.income / maxVal) * chartH;
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(cx - barW - 2, padT + chartH - h, barW, h);
      }

      if (b.expense > 0) {
        const h = (b.expense / maxVal) * chartH;
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(cx + 2, padT + chartH - h, barW, h);
      }

      ctx.fillStyle = '#6b7280';
      ctx.textAlign = 'center';
      ctx.font      = '10px system-ui, sans-serif';
      ctx.fillText(b.label, cx, H - padB + 14);
    });
  }

  // ─────────────────────────────────────────────────────────
  // EXPORT / IMPORT / CLEAR
  // ─────────────────────────────────────────────────────────

  function exportJSON() {
    const json = JSON.stringify(transactions, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = `budgetpro-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function exportCSV() {
    const header = 'id,type,amount,category,tag,date,note';
    const rows   = transactions.map(t =>
      [
        t.id,
        t.type,
        t.amount,
        `"${t.category}"`,
        t.tag || 'personal',
        t.date,
        `"${(t.note || '').replace(/"/g, '""')}"`
      ].join(',')
    );
    const csv  = [header, ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = `budgetpro-export-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data)) throw new Error('Expected an array');
        if (!confirm(`Import ${data.length} transaction(s)?\n\nThis will REPLACE all current data.`)) return;
        // Ensure every imported transaction has a tag field
        transactions = data.map(t => ({ tag: 'personal', ...t }));
        saveData();
        render();
      } catch {
        alert('Could not import: invalid or corrupted JSON file.');
      }
    };
    reader.readAsText(file);
    event.target.value = ''; // allow re-importing same file
  }

  function clearAll() {
    if (!confirm('Delete ALL transactions permanently?\nThis cannot be undone.')) return;
    transactions = [];
    saveData();
    render();
  }

  // ─────────────────────────────────────────────────────────
  // MASTER RENDER — calls all sub-renders
  // ─────────────────────────────────────────────────────────

  function render() {
    populateMonthFilter();
    renderSummary();
    renderTaxTracker();    // depends on filter-month value set by populateMonthFilter
    renderWeeklyCashflow();
    renderTransactions();
    renderRecurring();
    renderChart();
  }

  // ─────────────────────────────────────────────────────────
  // INIT
  // ─────────────────────────────────────────────────────────

  function init() {
    document.getElementById('header-date').textContent =
      new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

    // Default add-form date to today
    document.getElementById('form-date').value = new Date().toISOString().split('T')[0];

    // Populate category dropdowns
    populateCategories('form-category', 'income');
    populateCategories('edit-category', 'income');

    // Load persisted data (or seed on first run)
    loadSettings();
    loadData();
    loadRecurringData();

    // Initial render
    render();

    // Re-draw chart on window resize
    window.addEventListener('resize', renderChart);

    // Allow Enter key to submit the add-transaction form
    ['form-amount', 'form-date', 'form-category', 'form-tag', 'form-note'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') submitForm();
      });
    });
  }

  init();
</script>
</body>
